name: travelcrm

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_crm}
      POSTGRES_USER: ${POSTGRES_USER:-travelcrm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in /opt/travelcrm/.env}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  app:
    image: ${TRAVELCRM_IMAGE:?Set TRAVELCRM_IMAGE before running docker compose}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${APP_ENV_FILE:-/etc/travelcrm/travelcrm.env}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-travel_crm}
      DB_USERNAME: ${POSTGRES_USER:-travelcrm}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in /opt/travelcrm/.env}
      LOG_DIR: /var/log/travelcrm
    ports:
      - "127.0.0.1:${HOST_BIND_PORT:-8080}:8080"
    volumes:
      - app_logs:/var/log/travelcrm
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  app_logs:
