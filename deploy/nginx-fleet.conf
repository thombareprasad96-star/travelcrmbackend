# ===================================================================
# Vehicle Diary — nginx inside the compose stack
# -------------------------------------------------------------------
# Single-origin on purpose, and this is the main way it differs from the CRM's
# split-origin config: the SPA and /api are served from ONE hostname, so there is
# no CORS to configure, no VITE_API_URL to get wrong, and no second certificate.
# A fleet customer has one domain and expects one thing to work.
#
# INSTALL ORDER (same trap as the CRM config — read it before pasting):
# nginx refuses to load a config naming a certificate that does not exist yet, so
# `nginx -t` fails, the reload fails, and certbot (which needs a working nginx)
# cannot run either. Bring HTTP up first, get the cert, then switch TLS on:
#
#   1. DNS A record for your host → this VPS. Confirm it resolves; HTTP-01 needs it.
#   2. Start the stack with the `listen 443` block below still COMMENTED OUT.
#        docker compose -f docker-compose.fleet.yml up -d
#   3. docker compose -f docker-compose.fleet.yml run --rm --service-ports \
#        -v "$PWD/tls:/etc/letsencrypt" certbot/certbot certonly --standalone \
#        -d fleet.example.com
#      (or run certbot on the host and mount its live/ directory as TLS_DIR)
#   4. Uncomment the 443 block, set the server_name, then:
#        docker compose -f docker-compose.fleet.yml exec web nginx -s reload
#
# Renewal: whatever runs certbot MUST reload this container afterwards. Without a
# deploy hook the new cert lands on disk and nginx keeps serving the old one from
# memory until it expires — a site that dies two months after a deploy that looked
# fine. That failure has already happened once on the CRM host.
# ===================================================================

server {
    listen 80;
    server_name _;

    # ACME webroot. Outranks the redirect below by prefix length, so it keeps
    # working after TLS is switched on.
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Until TLS is on, serve directly. After step 4, replace the two locations
    # below with:  return 301 https://$host$request_uri;
    location /api/ {
        proxy_pass         http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Server-Sent Events (the notification stream) must not be buffered or the
        # browser receives nothing until the connection closes.
        proxy_buffering    off;
        proxy_cache        off;
        # A duty slip, a settlement sheet and a CSV export all outlive the default
        # 60s. The app's own timeout is 120s; stay above it so nginx is never the
        # one that gives up first.
        proxy_read_timeout 180s;
        # Receipt and certificate uploads: the app caps a file at 10 MB, and the
        # multipart request at 13 MB. Match it, or nginx 413s before Java can say why.
        client_max_body_size 13m;
    }

    location /actuator/health {
        proxy_pass http://app:8080;
        access_log off;
    }

    # The SPA. try_files with the index fallback is what makes a deep link like
    # /fleet/trips/{id} survive a browser refresh — without it nginx 404s on a path
    # that only exists in the client router.
    location / {
        root      /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable; index.html must never be cached or a deploy
    # keeps serving the previous bundle from the browser.
    location /assets/ {
        root      /usr/share/nginx/html;
        expires   1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        root      /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }
}

