# ===================================================================
# TravelCRM API — nginx reverse proxy (TLS termination)
# -------------------------------------------------------------------
# INSTALL — the order below is NOT optional.
#
# The ssl_certificate paths in this file point at certs that do not exist until certbot
# has run, and nginx refuses to load a config naming a missing cert. So `nginx -t` fails,
# the reload fails, and `certbot --nginx` (which needs a working nginx) cannot run either.
# Bring HTTP up first, get the certs by webroot, then switch TLS on:
#
#   1. DNS: A records for api.mytripsafar.com, mytripsafar.com and www.mytripsafar.com
#      → 187.127.159.81. Confirm they resolve — HTTP-01 validation needs this first.
#   2. sudo mkdir -p /var/www/html                      # the acme-challenge root below
#   3. Install this file with BOTH `listen 443` server blocks COMMENTED OUT — only the
#      two `listen 80` blocks active. (The acme-challenge location outranks the `location /`
#      301 by prefix length, so the redirect can stay.)
#        sudo cp deploy/nginx-travelcrm.conf /etc/nginx/sites-available/travelcrm
#        sudo ln -s /etc/nginx/sites-available/travelcrm /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx     # passes now
#   5. sudo certbot certonly --webroot -w /var/www/html \
#        -d api.mytripsafar.com --deploy-hook "systemctl reload nginx"
#   6. sudo certbot certonly --webroot -w /var/www/html \
#        -d mytripsafar.com -d www.mytripsafar.com --deploy-hook "systemctl reload nginx"
#      ⚠ APEX FIRST. certbot names the lineage after the first -d, and the SPA block below
#      hardcodes /etc/letsencrypt/live/mytripsafar.com/. Leading with www yields
#      live/www.mytripsafar.com/ and that path stays broken.
#   7. sudo ls /etc/letsencrypt/live/{api.mytripsafar.com,mytripsafar.com}/fullchain.pem
#   8. Uncomment both 443 blocks → sudo nginx -t && sudo systemctl reload nginx
#
# --deploy-hook is NOT optional: `certonly` records no installer, so without it the ~60-day
# renewal writes a fresh cert to disk and nginx keeps serving the old one from memory until
# it expires — a site that goes down two months after a deploy that looked fine.
#
# Tomcat listens on 127.0.0.1:8080 only (it is never exposed directly — see the
# ufw rules in docs/DEPLOYMENT.md). This is the sole way in.
# ===================================================================

# --- Access-log redaction for the inbound-lead webhook ------------------------
#
# WHY THIS EXISTS. The lead ingest URL is /api/webhooks/leads/{channel}/{token}, and that token is a
# BEARER CREDENTIAL: whoever holds it can create leads in a tenant's CRM. nginx's default `combined`
# format logs the full request line, so every delivery would write a live credential into
# travelcrm-access.log in plaintext — readable by anyone with log access, and copied into every backup
# and log shipper thereafter. The application already refuses to log the token (it logs only the
# `ingest_token_prefix`); nginx would have undone that.
#
# It also redacts the QUERY STRING on that prefix, which is not incidental. A GET-style push (the
# likeliest JustDial shape) carries the ENTIRE LEAD in the query — `?name=...&mobile=...` — so the
# default format would additionally write customer names and phone numbers into the access log. PII
# does not belong there; it belongs in lead_ingest_events, which is access-controlled and purged.
#
# HOW. The map's output is a REPLACEMENT, not a substitution — everything after the captured channel
# segment (token AND query) is simply dropped. `$loggable_uri` must therefore be used INSTEAD OF
# `$request` in the format below: `$request` carries the raw request line and would leak it straight
# back. Only this webhook prefix is touched; every other URI logs unchanged.
map $request_uri $loggable_uri {
    default                            $request_uri;
    "~^(/api/webhooks/leads/[^/]+)/"   "$1/[REDACTED]";
}

log_format travelcrm '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $loggable_uri $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# --- HTTP: redirect everything to HTTPS ---------------------------------------
# The ACME challenge path stays on HTTP so certbot can renew without downtime.
server {
    listen 80;
    listen [::]:80;
    server_name api.mytripsafar.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the API -----------------------------------------------------------
server {
    # `listen ... http2` and NOT the separate `http2 on;` directive: that directive was
    # added in nginx 1.25.1, and Ubuntu 24.04 ships 1.24.0 — where it is an unknown
    # directive that makes `nginx -t` fail outright, before anything else can be tested.
    # The listen parameter works on 1.24 and still functions on 1.25+ (deprecation warning).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.mytripsafar.com;

    # certbot fills these in.
    ssl_certificate     /etc/letsencrypt/live/api.mytripsafar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.mytripsafar.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Security headers ──────────────────────────────────────────────
    # HSTS: only add this once HTTPS is confirmed working — browsers honour it for
    # a year and you cannot take it back by removing the header.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # This host serves JSON and PDFs to a separate frontend origin — it has no pages
    # of its own to frame, script, or embed anything.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Don't advertise the nginx version on error pages / in Server:.
    server_tokens off;

    # ── Body size ─────────────────────────────────────────────────────
    # Must be >= spring.servlet.multipart.max-request-size (13MB) or nginx rejects
    # a passport scan with its own 413 before the app can return its friendly error.
    client_max_body_size 15M;

    # CORS is handled by the application (SecurityConfig.corsConfigurationSource,
    # driven by APP_CORS_ALLOWED_ORIGINS). Do NOT add CORS headers here too —
    # duplicated Access-Control-Allow-Origin headers make browsers reject the response.

    # gzip is intentionally NOT enabled for proxied responses: the app already
    # compresses JSON itself (server.compression.enabled=true). Doing it here as
    # well would just re-do the work nginx would then have to skip anyway.

    # ── Server-Sent Events ────────────────────────────────────────────
    # The notification streams are long-lived, incrementally-flushed responses.
    # With default proxy settings nginx buffers them and the client receives nothing
    # until timeout — the bell simply never updates. Buffering off + a long read
    # timeout are what make it work.
    #
    # A REGEX, not `location = `, because there are two independent realms with a
    # stream each: the tenant bell (/api/notifications/stream) and the platform
    # console bell (/api/super-admin/notifications/stream). An exact-match location
    # covers exactly one of them, and the other fails in the worst possible way —
    # it proxies fine, returns 200, holds the connection open, and simply never
    # delivers an event. Nothing errors; the bell is just permanently silent, in
    # production only. Any future realm's stream must be added to this alternation.
    location ~ ^/api/(notifications|super-admin/notifications)/stream$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # ── Image uploads ─────────────────────────────────────────────────
    # These traverse twice: browser → us, then us → Cloudinary, synchronously.
    # The catch-all's 60s read timeout would cut that off well before the
    # client's own 120s upload timeout, so give this path its own headroom.
    location ~ /upload-image$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_request_buffering off;
    }

    # ── Everything else ───────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # server.forward-headers-strategy=framework makes Spring read these, so
        # generated share links / redirects use the public https origin instead of
        # http://127.0.0.1:8080. RateLimitFilter also trusts X-Forwarded-For from
        # 127.0.0.1 only (app.ratelimit.trusted-proxies) — that trust is only sound
        # because Tomcat is not reachable from anywhere else.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        # PDF generation (quotation/invoice/voucher) is synchronous and the slowest
        # thing here; 60s is generous headroom over its real ~2-5s.
        proxy_read_timeout    60s;
    }

    # Health probe — no access logging, it would drown the log at 1 req/10s.
    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        access_log off;
    }

    # `travelcrm`, NOT the default `combined` — combined logs the raw request line, which on the
    # inbound-lead webhook is a live bearer token plus (on a GET push) the customer's name and phone.
    # See the map at the top of this file.
    access_log /var/log/nginx/travelcrm-access.log travelcrm;
    error_log  /var/log/nginx/travelcrm-error.log warn;
}

# ===================================================================
# THE REACT SPA — mytripsafar.com / www.mytripsafar.com
# -------------------------------------------------------------------
# A SEPARATE origin from the API above. That split is why the app needs CORS at
# all: APP_CORS_ALLOWED_ORIGINS must list both hostnames below, or every call the
# browser makes to api.mytripsafar.com is rejected before it reaches Spring.
#
# Deploy the build with:
#   npm run build          (in travelcrmfrontend, with VITE_API_URL set — see below)
#   sudo rsync -a --delete dist/ /var/www/travelcrm/
#
# VITE_API_URL is compiled INTO the bundle, so it must be
# https://api.mytripsafar.com/api at build time. Changing it later means a rebuild,
# not a config edit.
# ===================================================================

# --- HTTP: redirect to HTTPS --------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mytripsafar.com www.mytripsafar.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: static SPA --------------------------------------------------------
server {
    # `listen ... http2` and NOT the separate `http2 on;` directive: that directive was
    # added in nginx 1.25.1, and Ubuntu 24.04 ships 1.24.0 — where it is an unknown
    # directive that makes `nginx -t` fail outright, before anything else can be tested.
    # The listen parameter works on 1.24 and still functions on 1.25+ (deprecation warning).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mytripsafar.com www.mytripsafar.com;

    # certbot fills these in.
    ssl_certificate     /etc/letsencrypt/live/mytripsafar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mytripsafar.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;

    root  /var/www/travelcrm;
    index index.html;

    # ── SPA fallback ──────────────────────────────────────────────────
    # react-router owns every path. Without this, a deep link like
    # /Allbookings or a browser refresh on it asks nginx for a file that was
    # never built and gets a 404 — the app works only from the home page.
    # try_files hands unknown paths to index.html and lets the router resolve them.
    location / {
        try_files $uri $uri/ /index.html;

        # NOTE on add_header inheritance: headers set in a `location` REPLACE the
        # server-level set rather than merging. Every location that adds a header
        # must therefore repeat the security ones — hence the duplication below.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # SAMEORIGIN, not DENY: the API host denies framing outright because it has
        # no UI, but this app frames its own quotation preview (/q/:publicId).
        add_header X-Frame-Options "SAMEORIGIN" always;

        # HSTS — enable only AFTER https is confirmed working end-to-end. Browsers
        # honour it for a year and removing the header does not take it back.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # CSP — deliberately OFF until the app is verified working over https.
        # These are the origins the bundle genuinely needs; a CSP missing any one of
        # them fails silently in the browser console, not in nginx:
        #   res.cloudinary.com     master/hotel/vehicle images
        #   api.cloudinary.com     browser-direct unsigned uploads
        #   checkout.razorpay.com  subscription payment (script AND iframe)
        #   fonts.googleapis.com   Plus Jakarta Sans stylesheet
        #   fonts.gstatic.com      the font files themselves
        #   api.mytripsafar.com    every API call + the SSE notification stream
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self' https://api.mytripsafar.com https://api.cloudinary.com; frame-src https://checkout.razorpay.com; frame-ancestors 'self'" always;
    }

    # ── Caching ───────────────────────────────────────────────────────
    # Vite fingerprints every asset (app-C3xK9p.js), so these are immutable and
    # safe to cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # index.html must NEVER be cached: it is the only file whose name is stable, and
    # it carries the <script src> pointing at the current hashed bundle. A cached copy
    # keeps sending returning users to the previous deploy's assets, which no longer
    # exist after `rsync --delete` — a white screen that only clears on a hard refresh.
    # ⚠ This block, not `location /`, is where the SPA's security headers must live.
    # try_files above is an INTERNAL REDIRECT: it restarts location matching, this
    # exact-match block wins, and add_header does not merge across locations — it
    # REPLACES. So headers set in `location /` reach no HTML document at all, and any
    # CSP/HSTS added there would be inert while appearing configured: no console error,
    # no breakage, zero policy enforced. Keep the two sets in sync; this is the copy the
    # browser actually receives.
    # Verify against a ROUTE, not a static file: the file reads a different location.
    #   curl -sI https://mytripsafar.com/Allbookings | grep -iE 'x-frame|referrer|content-security'
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Enable these together with their twins in `location /` once https is verified.
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://res.cloudinary.com; connect-src 'self' https://api.mytripsafar.com https://api.cloudinary.com; frame-src https://checkout.razorpay.com; frame-ancestors 'self'" always;
    }

    client_max_body_size 15M;

    access_log /var/log/nginx/travelcrm-spa-access.log;
    error_log  /var/log/nginx/travelcrm-spa-error.log warn;
}