# ===================================================================
# PRODUCTION PROFILE
# -------------------------------------------------------------------
# Activated with SPRING_PROFILES_ACTIVE=prod (set in the systemd env file).
# Loaded ON TOP of application.properties — only the deltas live here.
#
# DESIGN RULE: every secret below is declared as ${VAR} with NO default.
# A missing environment variable therefore FAILS THE BOOT with
# "Could not resolve placeholder 'VAR'" instead of silently falling back to
# the public dev value baked into application.properties. Fail loud, not open.
#
# Deploy runbook + the full env-var list: docs/DEPLOYMENT.md
# ===================================================================

# ===================================================================
# DATABASE — no defaults; must come from the environment
# ===================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Pool sizing for a 2-vCPU VPS with Postgres on the SAME box.
# This app is I/O-bound, not CPU-bound, so a big pool buys nothing: each idle
# Postgres backend costs ~5-10 MB of the 8 GB we share with the JVM. 10 connections
# comfortably feed 100 Tomcat threads + 5 scheduler threads for a pilot tenant —
# raise only if you see Hikari "connection is not available" timeouts in the logs.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
# Log a stack trace for any connection held longer than 60s — the cheapest early
# warning for a leaked connection or a scheduler job stuck inside a transaction.
spring.datasource.hikari.leak-detection-threshold=60000

# ===================================================================
# SCHEMA MANAGEMENT
# -------------------------------------------------------------------
# ⚠ RISK, ACCEPTED FOR THIS PILOT: `update` lets Hibernate mutate the live schema
# at boot. It only ADDS tables/columns — it never drops or tightens — so it is
# survivable for a single test tenant, but it is NOT a long-term production answer:
# it cannot do data migrations, it cannot be reviewed before it runs, and two app
# instances starting together can race on DDL.
# Before real paying customers: review db/proposed/V1_PROPOSED__baseline_schema.sql,
# rename it into db/migration/ as V1__baseline_schema.sql, set FLYWAY_ENABLED=true,
# set JPA_DDL_AUTO=validate, and set SQL_INIT_MODE=never so db/indexes.sql stops
# replaying legacy DDL/backfills at boot. Existing pilot schemas must be baselined
# as a deliberate one-time operation only; FLYWAY_BASELINE_ON_MIGRATE defaults to false.
# ===================================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

# SQL formatting/comments are a dev-readability aid; they cost string building on
# every statement and are meaningless once SQL logging is off.
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# ===================================================================
# DEV DATA SEEDER — HARD OFF
# -------------------------------------------------------------------
# Deliberately a literal `false`, NOT ${APP_SEED_ENABLED:false}: this must not be
# switchable by a stray environment variable. DevDataSeeder creates a SuperAdmin
# with the hard-coded password "Password@123" plus a "Demo Travels" tenant and ~5
# fake rows in every major table. On a box a real tenant is testing against, that
# is both a data-integrity problem and a full authentication bypass.
# ===================================================================
app.seed.enabled=false

# ===================================================================
# DISHA AI ASSISTANT — NOT DEPLOYED THIS SPRINT
# -------------------------------------------------------------------
# The module is NOT removed, only switched off: disha.enabled=false stops
# ChatController from being created, so /ai/chat/** 404s and no CRM data can
# reach Groq. Entities/repositories/tool beans stay wired but unreachable.
#
# TO RE-ENABLE IN A LATER SPRINT:
#   1. flip disha.enabled to true below
#   2. set GROQ_API_KEY in /etc/travelcrm/travelcrm.env
#   3. uncomment the block underneath, then restart
# Nothing else changes — the base profile already carries the model/tuning config.
# ===================================================================
disha.enabled=false

# --- Groq wiring, parked until the AI sprint ---------------------------------
# spring.ai.openai.api-key=${GROQ_API_KEY}
# spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
# disha.context-max-turns=6
# disha.rag-enabled=false
# -----------------------------------------------------------------------------

# ===================================================================
# SECURITY — no defaults; ProductionConfigValidator additionally refuses to boot
# if any of these still holds the public dev value from application.properties.
# Generate each one fresh:  openssl rand -base64 32
# ===================================================================
jwt.secret=${JWT_SECRET}
portal.jwt.secret=${PORTAL_JWT_SECRET}
jwt.super-admin-expiry-ms=${JWT_SUPER_ADMIN_EXPIRY_MS:1800000}
app.super-admin.lockout.max-failed-attempts=${APP_SUPER_ADMIN_LOCKOUT_MAX_FAILED_ATTEMPTS:5}
app.super-admin.lockout.duration-seconds=${APP_SUPER_ADMIN_LOCKOUT_DURATION_SECONDS:900}
app.super-admin.password.min-length=${APP_SUPER_ADMIN_PASSWORD_MIN_LENGTH:12}
app.super-admin.password.max-length=${APP_SUPER_ADMIN_PASSWORD_MAX_LENGTH:128}
app.super-admin.invite-ttl-hours=${APP_SUPER_ADMIN_INVITE_TTL_HOURS:24}
app.super-admin.login-alerts.enabled=${APP_SUPER_ADMIN_LOGIN_ALERTS_ENABLED:true}
app.super-admin.login-alerts.from-email=${APP_SUPER_ADMIN_LOGIN_ALERTS_FROM_EMAIL:vetotechit@gmail.com}
app.super-admin.login-alerts.from-name=${APP_SUPER_ADMIN_LOGIN_ALERTS_FROM_NAME:Veto Tech IT}
app.console-base-url=${APP_CONSOLE_BASE_URL}

# Mandatory SuperAdmin MFA (Google Authenticator / Microsoft Authenticator compatible TOTP).
app.mfa.issuer=${APP_MFA_ISSUER:TravelCRM}
app.mfa.challenge-ttl-seconds=${APP_MFA_CHALLENGE_TTL_SECONDS:300}
app.mfa.max-attempts=${APP_MFA_MAX_ATTEMPTS:5}

# Pick ONCE per environment and never rotate without re-encrypting tenant_settings —
# this key decrypts every tenant's stored SMTP password and WhatsApp API key.
app.encryption.key=${APP_ENCRYPTION_KEY}

# Exact frontend origin(s), comma-separated, e.g. https://crm.example.com
# Never "*": the CORS config sends allowCredentials=true, and the browser rejects
# that combination anyway — a wildcard here just breaks every request instead.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# The public https:// origin of this API. Used to build quotation share links and
# the Razorpay webhook URL — if this stays localhost, every link mailed to a
# customer points at their own machine.
app.public-base-url=${APP_PUBLIC_BASE_URL}

# nginx is the only thing allowed to talk to Tomcat, so trust ITS X-Forwarded-For.
# RateLimitFilter honours the header only from these peers — otherwise a client
# could spoof it and mint a fresh rate-limit bucket per request.
app.ratelimit.trusted-proxies=${RATELIMIT_TRUSTED_PROXIES:127.0.0.1}

# ===================================================================
# SERVER HARDENING
# ===================================================================
# Bind loopback ONLY. Boot's default is every interface, which would publish the
# API on http://<public-ip>:8080 in plaintext — bypassing nginx's TLS, bypassing
# its rate limiting, and landing outside app.ratelimit.trusted-proxies=127.0.0.1
# so X-Forwarded-For spoofing becomes possible. Both nginx-travelcrm.conf and
# docs/DEPLOYMENT.md already assert this binding as an invariant; without this line
# ufw was the only thing enforcing it. Verify: ss -ltnp | grep 8080 → 127.0.0.1:8080
server.address=127.0.0.1

# Finish in-flight requests before exiting on `systemctl restart` instead of
# cutting them mid-transaction.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Behind nginx, Tomcat sees http://127.0.0.1:8080. This makes Spring honour
# X-Forwarded-Proto/Host so generated URLs and redirects come out as the real
# public https:// origin.
server.forward-headers-strategy=framework

# Never leak internals in an error body. GlobalExceptionHandler already renders the
# ApiError envelope; this governs the container's fallback /error page.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# No Boot whitelabel HTML error page: this host serves JSON to an API client, and the
# whitelabel page leaks the exception message and path. Unmapped errors fall through to
# GlobalExceptionHandler's ApiError envelope instead.
# (Tomcat already omits the Server: header by default — nothing to suppress there.)
server.error.whitelabel.enabled=false

# JSON list endpoints are the bulk of the traffic and this VPS's uplink is the
# scarce resource. NOTE: text/event-stream is intentionally absent — compressing
# SSE makes Tomcat buffer it and the notification/chat streams stop being live.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# 2 vCPU: 200 threads (the Boot default) just adds context-switching and memory
# over a 10-connection DB pool. 100 is still ~10x the concurrency this pilot sees.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:100}
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=2000
# SSE streams (notifications) are long-lived by design — don't reap them as stale.
server.tomcat.connection-timeout=20s

# ===================================================================
# TRASH / RECYCLE BIN
# -------------------------------------------------------------------
# The dev default is 1 DAY so the purge is testable. That value in production
# would HARD-DELETE a tenant's soft-deleted records ~24h after they hit the bin —
# the purge is the only place a hard delete happens, and it is irreversible.
# 30 days matches the documented product behaviour (see CLAUDE.md).
# ===================================================================
app.trash.retention-days=${TRASH_RETENTION_DAYS:30}

# ===================================================================
# LOGGING
# -------------------------------------------------------------------
# log4j2-prod.xml swaps the dev console appender for size-capped, rotating files.
# The dev log4j2.xml routes EVERY info line into a single uncapped logs/otp.log,
# which on a long-running VPS is an unbounded disk leak.
# ===================================================================
logging.config=classpath:log4j2-prod.xml
logging.file.path=${LOG_DIR:/var/log/travelcrm}

# Quotation flow logging is DEBUG in dev; that is per-request noise in prod.
logging.level.com.crm.travelcrm.quotation=INFO
logging.level.com.crm.travelcrm=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN

# ===================================================================
# DEVTOOLS — belt and braces
# Boot already disables DevTools inside a packaged fat JAR, and the Maven
# repackage drops the optional dependency. Assert it anyway: a live restart
# server listening on a prod box would be a remote code execution primitive.
# ===================================================================
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ===================================================================
# ACTUATOR
# health only, and anonymous callers see nothing but {"status":"UP"}.
# show-details=never (not when-authorized): any logged-in tenant user would
# otherwise be able to read DB/disk internals off the health payload.
# ===================================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=false
management.health.mail.enabled=false
