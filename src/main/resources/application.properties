# ===================================================================
# APPLICATION CONFIGURATION  —  SHARED + LOCAL-DEV DEFAULTS
# -------------------------------------------------------------------
# THIS FILE IS COMMITTED TO GIT. It must never contain a real credential.
#
# Every secret below is read as ${ENV_VAR:default} where the default is
# either blank or a throwaway LOCAL-ONLY value. Real values come from:
#   • LOCAL DEV  -> src/main/resources/application-local.properties (gitignored)
#   • PRODUCTION -> environment variables, loaded by systemd from /etc/travelcrm/travelcrm.env
#
# The prod profile (application-prod.properties) re-declares each secret with
# NO default, so a missing env var fails the boot loudly instead of silently
# starting with a dev value. See docs/DEPLOYMENT.md.
# ===================================================================
spring.application.name=travelcrm
server.port=${SERVER_PORT:8080}

# Active profile. Prod sets SPRING_PROFILES_ACTIVE=prod in the systemd env file.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# ===================================================================
# SPRING DEVTOOLS (dev only)
# quiet-period makes DevTools WAIT for the compiler to stop writing .class
# files before triggering a restart. Without it, an IDE incremental build that
# saves classes one-by-one can fire a restart mid-write, so the RestartClassLoader
# sees a half-updated target/classes (e.g. a service present but its DTO/mapper
# not yet rewritten) and boot fails with ClassNotFoundException/FileNotFound.
# ===================================================================
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s

# ===================================================================
# POSTGRESQL DATABASE CONNECTION
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/travel_crm}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings
# Sizing note: Postgres connections are ~10 MB each and this app is I/O bound, not
# CPU bound. The pool is deliberately small — see application-prod.properties for
# the 2-vCPU VPS sizing rationale.
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=TravelCRMHikariPool
spring.datasource.hikari.max-lifetime=2000000
spring.datasource.hikari.connection-timeout=30000

# ===================================================================
# JPA / HIBERNATE PROPERTIES
# ===================================================================
# Migrations own the schema on EVERY environment now, local included — Hibernate only checks that
# the entity model matches what the migrations built. `update` is no longer the default: it silently
# tolerates drift (it only ADDS, never tightens or drops), which is exactly how a local database
# ends up disagreeing with production.
#
# `validate` means the schema must ALREADY be correct before the app boots. A database that has not
# had the pending migration applied fails fast and legibly, e.g.
#   Schema-validation: missing column [username] in table [users]
# The fix is to apply the migration (see the Flyway block below for how, while Flyway itself is
# still disabled), NOT to switch back to `update`.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

spring.jpa.open-in-view=false

# ===================================================================
# FLYWAY MIGRATIONS
# -------------------------------------------------------------------
# V1 (baseline) and V2 are live in db/migration/, but Flyway stays OFF by default because
# turning it on currently BREAKS STARTUP:
#
#   Error creating bean 'entityManagerFactory': Failed to initialize dependency 'flyway' of
#   LoadTimeWeaverAware bean 'entityManagerFactory': Circular depends-on relationship between
#   'flyway' and 'entityManagerFactory'
#
# This is NOT caused by the ddl-auto setting — verified by experiment, it reproduces with
# FLYWAY_ENABLED=true under both `update` and `validate`, and is unaffected by SQL_INIT_MODE or by
# where @EnableJpaAuditing is declared. It is a pre-existing blocker that must be resolved BEFORE
# the Flyway cutover; until then FLYWAY_ENABLED=true cannot boot on any environment.
#
# Applying a migration meanwhile: run the .sql against the database directly, e.g.
#   psql -U <user> -d <db> -f src/main/resources/db/migration/V2__lead_code.sql
# Every statement in V1/V2 is idempotent by design, so this is safe to repeat.
#
# When the cycle is fixed, the cutover settings move together (docs/DEPLOYMENT.md):
#   fresh DB     — FLYWAY_ENABLED=true, FLYWAY_BASELINE_ON_MIGRATE=false, SQL_INIT_MODE=never
#   existing DB  — additionally FLYWAY_BASELINE_ON_MIGRATE=true for the FIRST boot only, so V1 is
#                  STAMPED rather than replayed, then set it back to false. The stamp verifies
#                  NOTHING; scripts/predeploy-flyway-shadow-check.ps1 does. Back up first.
# ===================================================================
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=${FLYWAY_BASELINE_VERSION:1}
spring.flyway.baseline-description=${FLYWAY_BASELINE_DESCRIPTION:Existing schema before Flyway}

# ===================================================================
# DEV DATA SEEDER (dev only — MUST be false in production)
# Inserts 5 demo rows into each major table on startup, idempotently
# (only when a table is empty), under one demo tenant. It also seeds a
# SuperAdmin with a HARD-CODED password — never let this run in prod.
# See DevDataSeeder; the prod profile forces this off.
# ===================================================================
app.seed.enabled=${APP_SEED_ENABLED:true}

# show-sql disabled: SQL is now logged via log4j2 (see HIBERNATE DEBUG LOGGING
# below). Keeping both ON would print every query twice.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Batch any lazy ToMany/ToOne loads (e.g. lead itinerary/services) into grouped
# IN (?,?,...) selects instead of one query per parent — backstops @BatchSize.
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# Supplementary DDL/DML (partial-unique indexes, logical-FK indexes, legacy data
# normalization) in db/indexes.sql. defer-datasource-initialization=true makes it
# run AFTER Hibernate creates/updates the schema. continue-on-error tolerates a
# pre-existing data conflict in dev without bricking startup. Set SQL_INIT_MODE=never
# after the reviewed V1 Flyway baseline owns this DDL.
spring.sql.init.mode=${SQL_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:db/indexes.sql
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# ===================================================================
# SCHEDULING / ASYNC POOLS
# -------------------------------------------------------------------
# This app registers 12 @Scheduled jobs (marketing campaign dispatch every
# minute, drip every 5 min, trash purge, subscription expiry, dunning, fleet +
# portal document expiry, usage sweep, reminders...). Spring's DEFAULT scheduler
# pool size is 1 — a single slow job would delay every other job behind it on the
# same thread. Size it to run the common jobs concurrently.
# ===================================================================
spring.task.scheduling.pool.size=${TASK_SCHEDULER_POOL_SIZE:5}
spring.task.scheduling.thread-name-prefix=crm-sched-

# Backs @Async (Spring Boot aliases this bean to `taskExecutor`, which is what
# @EnableAsync resolves to). Bounded so a burst cannot spawn unlimited threads.
spring.task.execution.pool.core-size=${TASK_EXEC_CORE_SIZE:4}
spring.task.execution.pool.max-size=${TASK_EXEC_MAX_SIZE:16}
spring.task.execution.pool.queue-capacity=500
spring.task.execution.thread-name-prefix=crm-async-

# ===================================================================
# HIBERNATE DEBUG LOGGING  (dev only — turn off in prod)
# ===================================================================
# Generated SQL statements. Kept at WARN by default — DEBUG here (plus bind=TRACE
# below) floods the request thread with formatted log I/O and noticeably slows
# list endpoints. Flip to DEBUG only while actively debugging a query.
logging.level.org.hibernate.SQL=WARN
# Actual values bound to the "?" placeholders  (Hibernate 6 / Spring Boot 3.x).
# VERY expensive — leave off unless you specifically need to see bound values.
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# --- Optional, uncomment when needed ---
# Values extracted from result sets (very verbose)
#logging.level.org.hibernate.orm.jdbc.extract=TRACE
# Transaction begin/commit/rollback — useful for TenantContext + @Transactional
#logging.level.org.springframework.transaction=DEBUG
#logging.level.org.springframework.orm.jpa=DEBUG
# Query counts + timings (catch N+1 / LazyInit issues)
#spring.jpa.properties.hibernate.generate_statistics=true
#logging.level.org.hibernate.stat=DEBUG

# ===================================================================
# APPLICATION DEBUG LOGGING  (dev only — prod profile forces this to INFO)
# Verbose flow logs for the quotation module (create/update/version/snapshot/
# pdf/email/search). Applied on top of log4j2.xml via Spring Boot's logging
# overrides — same mechanism as the Hibernate levels above.
# ===================================================================
logging.level.com.crm.travelcrm.quotation=DEBUG

# ===================================================================
# SECURITY & JWT CONFIGURATION
# -------------------------------------------------------------------
# The defaults below are LOCAL-DEV THROWAWAYS and are public (they have been in
# git history since the initial commit). They are safe only because a dev box is
