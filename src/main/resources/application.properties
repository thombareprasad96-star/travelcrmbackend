# ===================================================================
# TRAVELER PORTAL (customer-facing self-service)
# Travelers are a SEPARATE auth realm from staff: their JWT is signed with a
# DISTINCT key (portal.jwt.secret, never jwt.secret) and served by a dedicated
# SecurityFilterChain on /api/portal/**. A traveler token therefore fails
# signature validation on the staff chain and vice-versa — they can never cross.
# ===================================================================
portal.jwt.secret=A474IqgP7X82N9xh/cOLKZgwoEHlSMsuOCRHAW50Jmk=
# Short-lived (1h) — the portal is re-auth-friendly via OTP.
portal.jwt.expiry-ms=3600000
# OTP login uses the shared, plug-and-play otp module (app.otp.* below) — delivery channels are
# logging stubs until an SMS/WhatsApp/email provider bean is wired.
# Traveler login is booking-gated: access starts once a booking exists and lasts until the
# booking's travelDate + this many days. A customer with no booking inside that window cannot log in.
portal.access.days-after-travel=90
# Document-expiry reminders: fire at each of these day-thresholds before expiry; daily cron.
portal.document.expiry-reminder-days=60,30,7
portal.document.expiry-cron=0 0 8 * * *
# Allow passport/visa scans (default Spring cap is 1 MB). Service enforces a 10 MB per-file limit.
# Deliberately set 1 MB ABOVE the service's 10 MB rule: when the two are equal, an 11 MB upload trips
# Spring's MaxUploadSizeExceededException *before* PortalDocumentService can raise its friendly
# "File exceeds the 10 MB limit." message. With headroom, the service's check wins for anything the
# user is realistically uploading, and the Spring exception (mapped to 413) is only the backstop for
# a body too large to buffer at all.
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=13MB

# ===================================================================
# OTP MODULE (shared, plug-and-play — com.crm.travelcrm.otp)
# Used by the traveler portal login today; reusable for any OTP flow.
# Default store is in-memory; default delivery channels log (stub).
# ===================================================================
app.otp.length=6
app.otp.ttl-seconds=300
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

# ===================================================================
# DISHA AI ASSISTANT (Spring AI + Groq, OpenAI-compatible API)
# -------------------------------------------------------------------
# Disha calls Groq's hosted LLM over HTTPS — NO local model is run, which
# suits the small KVM VPS. Groq exposes an OpenAI-compatible endpoint, so
# we use Spring AI's OpenAI starter pointed at Groq's base URL. The final
# call is {base-url}/v1/chat/completions -> https://api.groq.com/openai/v1/chat/completions
#
# SETUP — never put the raw key in THIS file (it is committed to git). Instead:
#   • LOCAL DEV: paste your key into src/main/resources/application-local.properties
#     (gitignored). It is auto-imported below and overrides the placeholder.
#   • PRODUCTION (VPS): set the GROQ_API_KEY environment variable (systemd unit / .env).
# Get a free key at https://console.groq.com/keys. With no key the app still boots —
# chat calls just return a friendly "AI not configured" message until one is set.
#
# MODEL: llama-3.3-70b-versatile — strong at tool/function calling, which
# Disha relies on. Swap to llama-3.1-8b-instant for lower latency / higher
# free-tier throughput at some accuracy cost.
# ===================================================================
# Pull in the gitignored local overrides (your Groq key) if the file exists; ignored in prod.
spring.config.import=optional:classpath:application-local.properties
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY:MISSING_GROQ_API_KEY}

spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.2
# Cap the reply length. Groq's free-tier rate limiter counts prompt + this
# reservation toward the 12,000 tokens/minute (TPM) limit, so an uncapped
# reply reserves far more than a chat answer needs and trips 429s sooner.
spring.ai.openai.chat.options.max-tokens=900
# Make chat provider explicit; disable embeddings — Groq has NO embeddings
# endpoint, and embeddings are only needed by the optional RAG step (OFF).
# Enabling RAG later requires a separate embeddings provider.
spring.ai.model.chat=openai
spring.ai.model.embedding=none

# Disha tunables (bound by DishaProperties)
# Fewer replayed turns = smaller prompt = fewer tokens per call (helps stay
# under Groq's free-tier 12k tokens/minute). Raise if you upgrade the plan.
disha.context-max-turns=6
# RAG (Step B) stays OFF until the pgvector extension is installed
# (CREATE EXTENSION vector) and a KnowledgeChunk ingestion has run.
disha.rag-enabled=false

# PgVector auto-config is excluded so the app boots even though the `vector`
# extension is not yet installed on this PostgreSQL 18 instance. Disha provides
# its own PgVectorStore bean, gated on disha.rag-enabled (Step B). To enable RAG:
#   1. install pgvector and run `CREATE EXTENSION vector;`
#   2. set disha.rag-enabled=true  and restart
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
# Used by Disha's own vector-store bean when RAG is enabled (768 dims = nomic-embed-text):
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# ===================================================================
# FLEET / VEHICLE DIARY MODULE
# -------------------------------------------------------------------
# Daily document-expiry scan: vehicle insurance/RC/permit/PUC + active
# drivers' licences. Thresholds are days-before-expiry; 0 fires once
# more on/after the expiry date. Each (document, expiryDate, threshold)
# alerts at most once — see FleetExpiryScanService / fleet_document_alerts.
# ===================================================================
app.fleet.expiry-scan-cron=0 30 7 * * *
app.fleet.expiry-reminder-days=30,15,7,0
# Dashboard windows
app.fleet.dashboard-expiry-window-days=30
app.fleet.service-due-days=15
app.fleet.service-due-km-threshold=500

# ===================================================================
# USAGE METERING & QUOTAS
# Daily per-tenant sweep: warn a tenant's admins/managers as they approach a
# plan limit (users / bookings-per-month / storage) and record over-limit
# crossings on the platform audit log. Each (tenant, metric, month, level)
# alerts at most once. 6-field Spring cron: sec min hour dom mon dow.
# Booking creation is additionally hard-blocked (403) once the monthly cap is hit.
# ===================================================================
app.usage.scan-cron=0 0 6 * * *
# Near-limit warning fires at >= this percent of a quota (also drives the dashboard near-limit flag).
app.usage.warn-threshold-percent=80
