app.super-admin.invite-ttl-hours=${APP_SUPER_ADMIN_INVITE_TTL_HOURS:24}
app.super-admin.login-alerts.enabled=${APP_SUPER_ADMIN_LOGIN_ALERTS_ENABLED:true}
app.super-admin.login-alerts.from-email=${APP_SUPER_ADMIN_LOGIN_ALERTS_FROM_EMAIL:vetotechit@gmail.com}
app.super-admin.login-alerts.from-name=${APP_SUPER_ADMIN_LOGIN_ALERTS_FROM_NAME:Veto Tech IT}
app.console-base-url=${APP_CONSOLE_BASE_URL:http://localhost:5173}

# Mandatory SuperAdmin MFA (Google Authenticator / Microsoft Authenticator compatible TOTP).
app.mfa.issuer=${APP_MFA_ISSUER:TravelCRM}
app.mfa.challenge-ttl-seconds=${APP_MFA_CHALLENGE_TTL_SECONDS:300}
app.mfa.max-attempts=${APP_MFA_MAX_ATTEMPTS:5}

# Comma-separated browser origins allowed to call this API (CORS).
# Prod: set APP_CORS_ALLOWED_ORIGINS to the real frontend URL(s) — never "*",
# because the CORS config sends allowCredentials=true.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# AES-256 key (Base64, 32 bytes) for encrypting tenant integration secrets
# (SMTP password, WhatsApp API key). OVERRIDE via the APP_ENCRYPTION_KEY env var in prod —
# the value below is a dev default only. Changing it makes existing ciphertext undecryptable,
# so pick this ONCE per environment and then never rotate it without a re-encryption migration.
app.encryption.key=${APP_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

# ===================================================================
# EMAIL CONFIGURATION
# Platform CRM SMTP sender. Used only for SuperAdmin/platform security mail.
# Tenant/customer email uses each tenant's Settings > Email SMTP config and must not fall back here.
# NO DEFAULT — put real values in application-local.properties (dev) or the
# systemd env file (prod).
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===================================================================
# WHATSAPP CONFIGURATION
# Provider-level wiring for outbound WhatsApp (Interakt). Per-tenant secrets
# (API key, phone, default template) are saved in Settings -> WhatsApp and
# stored AES-encrypted on tenant_settings; these keys are app-wide only.
# ===================================================================
app.whatsapp.provider=interakt
app.whatsapp.default-country-code=+91
# NOTE: app.lead.default-country-code (below) is deliberately a SEPARATE key. This one addresses an
# outbound message; that one decides lead identity. Coupling them would let a WhatsApp provider
# change silently repartition which enquiries are treated as the same person.
app.whatsapp.default-language=en
app.whatsapp.interakt.base-url=https://api.interakt.ai/v1/public/message/
app.whatsapp.interakt.connect-timeout-ms=5000
app.whatsapp.interakt.read-timeout-ms=10000
# Approved template names per flow. Leave blank to fall back to the tenant's
# own default template. Interakt requires each template be pre-approved.
app.whatsapp.templates.otp=${WHATSAPP_TEMPLATE_OTP:}
app.whatsapp.templates.quotation=${WHATSAPP_TEMPLATE_QUOTATION:}
app.whatsapp.templates.reminder=${WHATSAPP_TEMPLATE_REMINDER:}

# ===================================================================
# CLOUDINARY CONFIGURATION
# NO DEFAULT — real values go in application-local.properties (dev) / env (prod).
# ===================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ===================================================================
# QUOTATION PDF / BRANDING
# Shown on the generated quotation PDF. Override per deployment.
# app.public-base-url is also the base for share links and the Razorpay webhook
# URL — it MUST be the public https:// origin in prod, not localhost.
# ===================================================================
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
quotation.pdf.company-name=TravelCRM
quotation.pdf.company-tagline=Your Journey, Our Passion
quotation.pdf.company-phone=
quotation.pdf.company-email=
quotation.pdf.company-website=
quotation.pdf.company-address=
quotation.pdf.company-logo-url=
quotation.pdf.brand-color=#2563EB

# ===================================================================
# TRASH / RECYCLE BIN
# Soft-deleted records are retained for `retention-days`, then permanently
# (hard) purged by TrashPurgeScheduler. The purge is the ONLY place a hard
# delete happens. The job runs per-tenant (tenant isolation) on this cron.
# Dev uses 1 day so the purge is testable; PROD USES 30 (see prod profile) —
# shipping 1 to a real tenant would destroy restorable data after a single day.
# ===================================================================
app.trash.retention-days=${TRASH_RETENTION_DAYS:1}
# Daily at 02:30 (server time). 6-field Spring cron: sec min hour dom mon dow.
app.trash.purge-cron=0 30 2 * * *

# ===================================================================
# SUBSCRIPTION / PLAN EXPIRY
# Daily sweep: ACTIVE/TRIAL tenants past their subscriptionEndDate are flipped
# to EXPIRED (which blocks their staff from logging in). 6-field Spring cron.
# Also invocable on demand via POST /api/super-admin/subscriptions/run-expiry.
# ===================================================================
app.subscription.expiry-cron=0 0 3 * * *

# Dunning (grace-then-block): a tenant with an invoice overdue past its due date is flipped
# ACTIVE→PAST_DUE (still operational, admins warned); once that invoice is overdue by more than
# grace-days it flips PAST_DUE→EXPIRED (login blocked). A webhook payment.captured that clears the
# last overdue invoice reactivates the tenant. Grace is anchored to the invoice DUE DATE.
# Runs daily (after the expiry sweep); also POST /api/super-admin/subscriptions/run-dunning.
app.subscription.grace-days=7
app.subscription.dunning-cron=0 15 3 * * *

# ===================================================================
# IMPERSONATION
# SuperAdmin "act as tenant user" token TTL — short by design (30 min).
# Signed with jwt.secret (typ=IMPERSONATION) so the staff app accepts it.
# ===================================================================
impersonation.jwt.expiry-ms=1800000

# ===================================================================
# RAZORPAY — SaaS subscription billing gateway (platform <- tenant)
# -------------------------------------------------------------------
# Distinct from the customer->tenant booking-payment SPI (portal.payment).
# The gateway stays OFF until real keys are set: with enabled=false the app
# still boots and /api/company/billing + /api/webhooks/razorpay exist, but
# order creation returns 503 (UnavailablePaymentGatewayClient) until a key
# is configured. Flip enabled=true and set the keys to go live.
#
# SETUP — never commit live keys. In prod set via env vars:
#   RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET
# key-id is the PUBLIC id (rzp_test_/rzp_live_) handed to Checkout; the
# secret signs Orders API calls; webhook-secret verifies inbound webhooks
# (set the SAME value in the Razorpay dashboard → Webhooks).
# Webhook URL to register in the dashboard: {public-base-url}/api/webhooks/razorpay
# Subscribe at least: payment.captured, payment.failed (+ subscription.* later).
# ===================================================================
app.razorpay.enabled=${RAZORPAY_ENABLED:false}
app.razorpay.key-id=${RAZORPAY_KEY_ID:}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.razorpay.currency=INR
app.razorpay.api-base-url=https://api.razorpay.com/v1
app.razorpay.connect-timeout-ms=5000
app.razorpay.read-timeout-ms=10000

# ===================================================================
# Booking tax rates (fraction of customerAmount). Externalised so they can be
# tuned per environment. NOTE: still flat rates for every booking — correct Indian
# TCS is slabbed (nil domestic; 5% up to 7L, 20% above under LRS) and GST varies by
# service, which needs a domestic/overseas + product classification the booking model
# does not yet carry. See BookingServiceImpl.calculateAndApplyFinancials.
# ===================================================================
app.booking.gst-rate=0.05
app.booking.tcs-rate=0.05

# Quotation PDF template is rendered by a dedicated XML-mode engine in
# QuotationPdfService; disable Boot's auto Thymeleaf template-location check.
spring.thymeleaf.check-template-location=false

# ===================================================================
# TRAVELER PORTAL (customer-facing self-service)
# Travelers are a SEPARATE auth realm from staff: their JWT is signed with a
# DISTINCT key (portal.jwt.secret, never jwt.secret) and served by a dedicated
# SecurityFilterChain on /api/portal/**. A traveler token therefore fails
# signature validation on the staff chain and vice-versa — they can never cross.
# The default below is a dev throwaway; prod supplies PORTAL_JWT_SECRET.
# ===================================================================
portal.jwt.secret=${PORTAL_JWT_SECRET:A474IqgP7X82N9xh/cOLKZgwoEHlSMsuOCRHAW50Jmk=}
# Short-lived (1h) — the portal is re-auth-friendly via OTP.
portal.jwt.expiry-ms=3600000
# OTP login uses the shared, plug-and-play otp module (app.otp.* below) — delivery channels are
# logging stubs until an SMS/WhatsApp/email provider bean is wired.
# Traveler login is booking-gated: access starts once a booking exists and lasts until the
# booking's travelDate + this many days. A customer with no booking inside that window cannot log in.
portal.access.days-after-travel=90
# Document-expiry reminders: fire at each of these day-thresholds before expiry; daily cron.
portal.document.expiry-reminder-days=60,30,7
portal.document.expiry-cron=0 0 8 * * *
# Allow passport/visa scans (default Spring cap is 1 MB). Service enforces a 10 MB per-file limit.
# Deliberately set 1 MB ABOVE the service's 10 MB rule: when the two are equal, an 11 MB upload trips
# Spring's MaxUploadSizeExceededException *before* PortalDocumentService can raise its friendly
# "File exceeds the 10 MB limit." message. With headroom, the service's check wins for anything the
# user is realistically uploading, and the Spring exception (mapped to 413) is only the backstop for
# a body too large to buffer at all.
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=13MB

# ===================================================================
# OTP MODULE (shared, plug-and-play — com.crm.travelcrm.otp)
# Used by the traveler portal login today; reusable for any OTP flow.
# Default store is in-memory; default delivery channels log (stub).
# NOTE: InMemoryOtpStore is single-node only. It is correct for one VPS, but the
# moment a second app instance runs behind a load balancer, an OTP issued by node
# A cannot be verified on node B — add a Redis-backed OtpStore (@Primary) first.
# ===================================================================
app.otp.length=6
app.otp.ttl-seconds=300
app.otp.max-attempts=5
app.otp.resend-cooldown-seconds=60

# ===================================================================
# DISHA AI ASSISTANT (Spring AI + Groq, OpenAI-compatible API)
# -------------------------------------------------------------------
# Disha calls Groq's hosted LLM over HTTPS — NO local model is run, which
# suits the small KVM VPS. Groq exposes an OpenAI-compatible endpoint, so
# we use Spring AI's OpenAI starter pointed at Groq's base URL. The final
# call is {base-url}/v1/chat/completions -> https://api.groq.com/openai/v1/chat/completions
#
# SETUP — never put the raw key in THIS file (it is committed to git). Instead:
#   • LOCAL DEV: paste your key into ./application-local.properties at the PROJECT ROOT
#     (gitignored). It is auto-imported below and overrides the placeholder.
#   • PRODUCTION (VPS): set the GROQ_API_KEY environment variable (systemd unit / .env).
# Get a free key at https://console.groq.com/keys. With no key the app still boots —
# chat calls just return a friendly "AI not configured" message until one is set.
#
# MODEL: llama-3.3-70b-versatile — strong at tool/function calling, which
# Disha relies on. Swap to llama-3.1-8b-instant for lower latency / higher
# free-tier throughput at some accuracy cost.
# ===================================================================
# Pull in the gitignored local overrides (Groq key, SMTP, Cloudinary) if present.
# `file:./` = project root, which is the working dir for mvnw spring-boot:run, the IDE
# and tests. It is deliberately NOT a classpath: import — a classpath resource would be
# packaged into the fat JAR and ship the secrets with every artifact. On the VPS this
# file does not exist and the values come from environment variables instead.
# The classpath entry is kept only as a fallback for older checkouts; the build
# (pom.xml <resources> exclude) guarantees it can never be packaged.
spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.api-key=${GROQ_API_KEY:MISSING_GROQ_API_KEY}

spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.2
# Cap the reply length. Groq's free-tier rate limiter counts prompt + this
# reservation toward the 12,000 tokens/minute (TPM) limit, so an uncapped
# reply reserves far more than a chat answer needs and trips 429s sooner.
spring.ai.openai.chat.options.max-tokens=900
# Make chat provider explicit; disable embeddings — Groq has NO embeddings
# endpoint, and embeddings are only needed by the optional RAG step (OFF).
# Enabling RAG later requires a separate embeddings provider.
spring.ai.model.chat=openai
spring.ai.model.embedding=none

# Disha tunables (bound by DishaProperties)
# Fewer replayed turns = smaller prompt = fewer tokens per call (helps stay
# under Groq's free-tier 12k tokens/minute). Raise if you upgrade the plan.
disha.context-max-turns=6
# RAG (Step B) stays OFF until the pgvector extension is installed
# (CREATE EXTENSION vector) and a KnowledgeChunk ingestion has run.
disha.rag-enabled=false

# PgVector auto-config is excluded so the app boots even though the `vector`
# extension is not yet installed on this PostgreSQL 18 instance. Disha provides
# its own PgVectorStore bean, gated on disha.rag-enabled (Step B). To enable RAG:
#   1. install pgvector and run `CREATE EXTENSION vector;`
#   2. set disha.rag-enabled=true  and restart
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
# Used by Disha's own vector-store bean when RAG is enabled (768 dims = nomic-embed-text):
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
# ===================================================================
# FLEET / VEHICLE DIARY MODULE
# -------------------------------------------------------------------
# Daily document-expiry scan: vehicle insurance/RC/permit/PUC + active
# drivers' licences. Thresholds are days-before-expiry; 0 fires once
# more on/after the expiry date. Each (document, expiryDate, threshold)
# alerts at most once — see FleetExpiryScanService / fleet_document_alerts.
# ===================================================================
app.fleet.expiry-scan-cron=0 30 7 * * *
app.fleet.expiry-reminder-days=30,15,7,0
# Dashboard windows
app.fleet.dashboard-expiry-window-days=30
app.fleet.service-due-days=15
app.fleet.service-due-km-threshold=500

# ===================================================================
# USAGE METERING & QUOTAS
# Daily per-tenant sweep: warn a tenant's admins/managers as they approach a
# plan limit (users / bookings-per-month / storage) and record over-limit
# crossings on the platform audit log. Each (tenant, metric, month, level)
# alerts at most once. 6-field Spring cron: sec min hour dom mon dow.
# Booking creation is additionally hard-blocked (403) once the monthly cap is hit.
# ===================================================================
app.usage.scan-cron=0 0 6 * * *
# Near-limit warning fires at >= this percent of a quota (also drives the dashboard near-limit flag).
app.usage.warn-threshold-percent=80

# ===================================================================
# ACCOUNTING / GST DEPTH MODULE (com.crm.travelcrm.accounting)
# -------------------------------------------------------------------
# Per-tenant GST scheme, tax masters and invoice numbering live in the DB
# (accounting_settings + hsn_sac_rates). These app-wide keys hold the statutory
# rate tables that are the same for every tenant and change only by FY / Finance Act.
# ===================================================================
# TCS under Section 206C(1G) on overseas tour packages: nil for domestic; the
# below-threshold rate up to the annual threshold, the above-threshold rate beyond it
# (LRS). Applied only when a booking is flagged as an overseas tour package.
app.accounting.tcs.overseas.threshold=700000
app.accounting.tcs.overseas.rate-below=0.05
app.accounting.tcs.overseas.rate-above=0.20
# TDS deducted when paying vendors, by section (fraction of the taxable/base amount).
# 206AA: a flat 20% applies when the vendor has furnished no PAN, overriding the section rate.
app.accounting.tds.section-194c=0.02
app.accounting.tds.section-194h=0.05
app.accounting.tds.section-194j=0.10
app.accounting.tds.no-pan-rate=0.20

# ===================================================================
# MARKETING & CAMPAIGNS (com.crm.travelcrm.marketing)
# -------------------------------------------------------------------
# Three per-tenant schedulers (TenantContext set/clear-in-finally, catch-per-tenant, idempotent).
# 6-field Spring cron: sec min hour dom mon dow. Delivery reuses the WhatsApp (Interakt) /
# tenant-SMTP senders; sends are throttled per tenant+channel via RateLimitService.
# ===================================================================
# Dispatch due campaigns + resume in-flight SENDING batches (~every minute).
app.marketing.campaign-cron=0 * * * * *
# Sync segment enrollments + advance due drip steps (~every 5 minutes).
app.marketing.drip-cron=0 */5 * * * *
# Fire birthday/anniversary matches once per day per trigger, at/after its send-time (~hourly).
app.marketing.automation-cron=0 0 * * * *
# Max messages per tenant+channel per rolling minute; when a window is exhausted mid-batch,
# remaining recipients stay PENDING and resume on the next scheduler tick.
app.marketing.rate.per-minute=60
# Recipients materialised + attempted per dispatch transaction (keeps each tx bounded).
app.marketing.batch-size=200

# ===================================================================
# ACTUATOR — health probes for nginx / systemd / uptime monitoring
# Only `health` is exposed, and it shows no internal details anonymously.
# /actuator/health/readiness and /liveness come from the probes flag below.
# ===================================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.health.redis.enabled=false
management.health.mail.enabled=false

# ===================================================================
# LEAD — identity / canonicalisation
# ===================================================================
# Country prefix assumed for a lead phone typed without one, when deriving the
# canonical shadow key `leads.phone_normalized` (PhoneCanonicalizer).
#
# Affects the SHADOW column only — the raw `phone` is never rewritten. Changing
# this value changes how future phones canonicalise but does NOT re-derive stored
# ones, so a change must be followed by a re-run of the backfill
# (LeadPhoneNormalizationBackfill) or old and new rows will key differently.
#
# The canonicaliser assumes a FIXED 10-digit national numbering plan (India). See
# PhoneCanonicalizer.NATIONAL_DIGITS before pointing this at another country.
app.lead.default-country-code=+91

# How long a rotated ingest token keeps working after being replaced.
#
# Rotation MUST overlap. The tenant has to go and paste the new webhook URL into
# the provider's console (JustDial, IndiaMART, ...) by hand, and every lead that
# arrives in that human-sized gap is lost SILENTLY — the provider just gets a 401
# and stops. 72h is a long weekend.
#
# Set to 0 only if you intend an instant cutover and accept that loss.
app.lead.token-rotation-overlap-hours=72
